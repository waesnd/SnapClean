name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep the same debug signing certificate between beta builds.
      # Cache is best-effort; production releases require a protected signing key.
      - name: Restore beta debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: snapclean-beta-debug-signing-v1
      - name: Run parser regression tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify stable release signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SNAPCLEAN_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SNAPCLEAN_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SNAPCLEAN_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SNAPCLEAN_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Stable release signing not configured; debug APK is still available."
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
          else
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          fi
      - name: Build stable signed release APK
        if: env.STABLE_SIGNING == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SNAPCLEAN_KEYSTORE_BASE64 }}
          SNAPCLEAN_STORE_PASSWORD: ${{ secrets.SNAPCLEAN_STORE_PASSWORD }}
          SNAPCLEAN_KEY_ALIAS: ${{ secrets.SNAPCLEAN_KEY_ALIAS }}
          SNAPCLEAN_KEY_PASSWORD: ${{ secrets.SNAPCLEAN_KEY_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/snapclean-release.jks"
          echo "SNAPCLEAN_KEYSTORE_PATH=$RUNNER_TEMP/snapclean-release.jks" >> "$GITHUB_ENV"
          SNAPCLEAN_KEYSTORE_PATH="$RUNNER_TEMP/snapclean-release.jks" gradle assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/snapclean-release.jks"
      - name: Upload signed release APK
        if: env.STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SnapClean-signed-release
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SnapClean-debug
          path: app/build/outputs/apk/debug/app-debug.apk
