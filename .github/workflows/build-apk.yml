name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep the same debug signing certificate between beta builds.
      # Cache is best-effort; production releases require a protected signing key.
      - name: Restore beta debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: snapclean-beta-debug-signing-v1
      - name: Run parser regression tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SnapClean-debug
          path: app/build/outputs/apk/debug/app-debug.apk
